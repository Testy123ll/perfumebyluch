<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f0f10">
<title>Perfumes By Luch | Niche & Designer Offers</title>
<meta name="description" content="Get 100% Original Niche & Designer Bottles at Up To 50% Off Retail. View current offers from Perfumes By Luch.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f10;--card:#18181a;--card2:#141416;--text:#f4efe9;--muted:#a79fa3;--line:#2b2a2d;--pink:#f1a0b2;--pink2:#e07a95;--max:760px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 'Inter',system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{width:min(var(--max),calc(100% - 36px));margin:0 auto}
header{border-bottom:1px solid var(--line);background:rgba(15,15,16,.8);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}
.header-inner{min-height:64px;display:flex;justify-content:center;align-items:center;text-align:center}
.brand{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:600;letter-spacing:.16em}
.brand small{display:block;font-family:'Inter',sans-serif;font-size:9px;font-weight:500;letter-spacing:.28em;margin-top:2px;color:var(--pink)}
.hero{padding:72px 0 52px;text-align:center;position:relative;background:radial-gradient(ellipse at 50% 0%,rgba(241,160,178,.16),transparent 65%)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.3em;font-weight:600;margin:0 0 16px;color:var(--pink)}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;line-height:1.08;letter-spacing:-.01em;margin:0;font-weight:600}
h1{font-size:clamp(40px,8vw,66px);max-width:720px;margin:0 auto}
.hero-copy{max-width:540px;color:var(--muted);margin:20px auto 0;font-size:16px}
.offer-points{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 20px;margin:24px auto 28px;font-size:13px;font-weight:500;color:var(--text)}
.offer-points span:before{content:'✓';margin-right:7px;color:var(--pink)}
.button{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:14px 30px;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#1a0d11;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.08em;border:0;border-radius:999px;text-align:center;box-shadow:0 8px 30px -8px rgba(241,160,178,.55);transition:transform .2s,box-shadow .2s}
.button:hover{transform:translateY(-2px);box-shadow:0 12px 36px -8px rgba(241,160,178,.75)}
.microcopy{font-size:12px;color:var(--muted);margin:14px auto 0;max-width:480px}
.offer-band{background:var(--card2);border-block:1px solid var(--line);padding:32px 0;text-align:center}
.offer-band h2{font-size:clamp(26px,4.5vw,36px)}
.offer-band p{max-width:540px;margin:12px auto 0;color:var(--muted);font-size:14px}
section{padding:48px 0}
.section-title{text-align:center;font-size:clamp(30px,5vw,40px);margin-bottom:10px}
.section-copy{text-align:center;max-width:540px;color:var(--muted);font-size:14px;margin:0 auto 26px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
.step{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:22px 14px;transition:border-color .2s,transform .2s}
.step:hover{border-color:rgba(241,160,178,.45);transform:translateY(-3px)}
.step strong{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;font-weight:600;margin-bottom:6px;color:var(--pink)}
.step span{font-size:13px;color:var(--muted)}
.feedback{border-top:1px solid var(--line)}
.testimonial-grid{column-count:3;column-gap:10px}
figure{margin:0 0 10px;break-inside:avoid;-webkit-column-break-inside:avoid;border:1px solid var(--line);padding:6px;background:var(--card);border-radius:14px;overflow:hidden}
figure img{display:block;width:100%;height:auto;border-radius:9px}
.note{text-align:center;font-size:11px;color:var(--muted);margin:16px auto 0}
.final-cta{background:radial-gradient(ellipse at 50% 100%,rgba(241,160,178,.18),transparent 70%),var(--card2);border-top:1px solid var(--line);text-align:center;padding:56px 0}
.final-cta h2{font-size:clamp(32px,6vw,48px);max-width:600px;margin:0 auto}
.final-cta p{color:var(--muted);max-width:500px;font-size:14px;margin:14px auto 24px}
.final-cta p.eyebrow{color:var(--pink);margin:0 auto 14px}
footer{padding:20px 0;text-align:center;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
.sticky-cta{display:none}
a:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
@media(max-width:600px){.hero{padding:48px 0 38px}.hero-copy{font-size:15px}.offer-points{gap:8px 13px;font-size:12px}.steps{grid-template-columns:1fr;gap:10px}.step{padding:16px}.testimonial-grid{column-count:2;column-gap:7px}figure{margin-bottom:7px}.sticky-cta{display:block;position:fixed;bottom:0;left:0;right:0;background:rgba(15,15,16,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:9px 14px;z-index:20}.sticky-cta .button{width:100%;min-height:46px}body{padding-bottom:68px}}
